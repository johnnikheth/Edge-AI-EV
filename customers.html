<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Updates</title>
<link rel="stylesheet" href="common.css">
<style>
.card{margin-bottom:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button{border-radius:99px;padding:7px 14px}
.filters button.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.msgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:18px}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:12px;padding:14px 16px;margin:0}
.msg .who{display:flex;justify-content:space-between;gap:8px;align-items:center}
.msg .who b{font-size:15px}
.msg p{margin:8px 0;line-height:1.5}
.msg small{color:var(--muted)}
.empty{text-align:center;padding:40px 16px}
</style>
</head>
<body>
<div class="wrap wide">

  <section class="herobox">
    <div class="bg" id="heroBg"></div>
    <div class="shade"></div>
    <div class="content">
      <div>
        <h1>Customer updates</h1>
        <div id="status">Every message the dispatch agent sends when a delivery is delayed, moved to another van, or needs rescheduling. Refreshed every few seconds.</div>
        <div class="actions">
          <a href="dispatch.html"><button class="primary big">🎬 Run a delivery day</button></a>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="glass">
        <div class="kpi"><b id="kAll">0</b><span>Messages sent</span></div>
        <div class="kpi"><b id="kDelay" style="color:var(--warn)">0</b><span>Running late</span></div>
        <div class="kpi"><b id="kMoved" style="color:var(--load)">0</b><span>Moved to another van</span></div>
        <div class="kpi"><b id="kRes" style="color:var(--limit)">0</b><span>Offered a reschedule</span></div>
      </div>
    </div>
  </section>

  <div class="card">
    <div class="filters" id="kinds"></div>
    <div class="filters" style="margin-top:10px">
      <span class="note">Vehicle:</span><span id="vehs" class="filters"></span>
      <input type="search" id="q" placeholder="Search customer or stop…" style="margin-left:auto;font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);min-width:220px">
    </div>
  </div>

  <div class="msgs" id="list"></div>
</div>

<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const COL = {delay:'var(--warn)', reassigned:'var(--load)', reschedule:'var(--limit)'};
const LABEL = {delay:'Running late', reassigned:'Moved to another van', reschedule:'Reschedule offered'};
let all = [], kind = '', veh = '';

function show(){
  const q = $('q').value.trim().toLowerCase();
  const rows = all.filter(n => (!kind || n.kind===kind) && (!veh || n.vehicle===veh) &&
    (!q || (n.customer+' '+n.stop_id+' '+n.message).toLowerCase().includes(q)));
  const count = k => all.filter(n=>n.kind===k).length;
  $('kAll').textContent = all.length; $('kDelay').textContent = count('delay'); $('kMoved').textContent = count('reassigned'); $('kRes').textContent = count('reschedule');
  const runs = [...new Set(all.map(n=>n.session_id))].length;
  $('chips').innerHTML = `<span class="chip">📨 ${runs} delivery day${runs===1?'':'s'}</span><span class="chip">🔍 Showing ${rows.length} of ${all.length}</span>` +
    (API.config.granite ? '<span class="chip">✍ Worded by watsonx Granite</span>' : '<span class="chip off">✍ Template wording (watsonx not connected)</span>');
  $('kinds').innerHTML = [['','All'],['delay','Running late'],['reassigned','Moved to another van'],['reschedule','Reschedule offered']]
    .map(([k,t])=>`<button data-k="${k}" class="${k===kind?'sel':''}">${t}</button>`).join('');
  $('kinds').querySelectorAll('button').forEach(b=>b.onclick = () => { kind = b.dataset.k; show(); });
  const names = [...new Set(all.map(n=>n.vehicle))].sort();
  $('vehs').innerHTML = ['',...names].map(v=>`<button data-v="${esc(v)}" class="${v===veh?'sel':''}">${v?esc(v):'All'}</button>`).join('');
  $('vehs').querySelectorAll('button').forEach(b=>b.onclick = () => { veh = b.dataset.v; show(); });
  $('list').innerHTML = rows.length ? rows.map(n => `<div class="msg" style="border-left-color:${COL[n.kind]||'var(--idle)'}">
      <div class="who"><b>${esc(n.customer)}</b><span class="badge" style="background:${COL[n.kind]||'var(--idle)'}">${LABEL[n.kind]||esc(n.kind)}</span></div>
      <p>${esc(n.message)}</p>
      <small>${esc(n.stop_id)} · ${esc(n.vehicle)}${n.eta ? ' · new ETA '+esc(n.eta) : ''} · day #${n.session_id ?? '?'} · ${new Date(n.created*1000).toLocaleString()}</small></div>`).join('')
    : `<div class="card empty note" style="grid-column:1/-1">${all.length ? 'No messages match these filters.' : 'No customer messages yet. Run the demo scenario on the <a href="dispatch.html">Dispatch</a> page.'}</div>`;
}
async function load(){
  try { all = await API.j('GET','/api/notifications?limit=500'); show(); } catch(e){}
}
$('q').oninput = show;
initNav('customers').then(() => {
  if (!API.online){ $('list').innerHTML = '<div class="card empty note" style="grid-column:1/-1">The server is offline. Run <b>python3 server.py</b> and open http://localhost:8000/customers.html.</div>'; return; }
  load(); setInterval(load, 3000);
});
</script>
</body>
</html>
